{% extends 'base.html' %}

{% block title %}Удалить публикацию{% endblock %}

{% block content %}
<h2>Удалить публикацию</h2>
<p>Вы уверены, что хотите удалить "{{blog.title}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:blogs_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
