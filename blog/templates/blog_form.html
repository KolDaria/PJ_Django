{% extends 'base.html' %}

{% block title %}Форма блога{% endblock %}

{% block content %}
<h2>Форма блога</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:blogs_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
