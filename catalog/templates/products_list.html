{% extends 'base.html' %}

{% block name %}Список товаров{% endblock %}

{% block content %}
<h2>Список товаров</h2>
</div>
<div class="container mt-3">
    <ul class="list-group">
        {% for product in products %}
        <li class="list-group-item">
            {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" width="100">
        {% endif %}
            {{ product.name }}: {{product.description|truncatechars:100}}

            <a href="{% url 'catalog:product_detail' product_id=product.pk %}" class="btn btn-primary btn-sm" style="margin-top: 5px;">Подробнее</a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
