{% extends 'base.html' %}

{% block title %}Добавить/Редактировать продукт{% endblock %}

{% block content %}
<h2>Добавить/Редактировать продукт</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="container">
        <div class="col-md-12">
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </div>
</form>
{% endblock %}
