<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block name %}Главная страница{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Добро пожаловать на мой сайт!</h1>
    <p>Это главная страница. Выберите что вас интересует.</p>
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list' %}">Перейти в товары</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blogs_list' %}">Перейти в блог</a>
